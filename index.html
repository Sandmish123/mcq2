<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ITIL 4 Mock Exams – Papers 10 &amp; 11</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#667;--bd:#d8dce6;--ac:#3b5bdb;--ok:#2b8a3e;--okb:#e6f6ea;--no:#c92a2a;--nob:#fdeaea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1d2029;--tx:#e8eaf0;--mut:#9aa;--bd:#343949;--ac:#7b93ff;--ok:#6fd286;--okb:#1b3324;--no:#ff8787;--nob:#3a1e1e}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1d2029;--tx:#e8eaf0;--mut:#9aa;--bd:#343949;--ac:#7b93ff;--ok:#6fd286;--okb:#1b3324;--no:#ff8787;--nob:#3a1e1e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:2;display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--mut);border-bottom:1px solid var(--bd)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.q.bad{border-color:var(--no)}.q.good{border-color:var(--ok)}
.q p{margin:0 0 10px;font-weight:600}
label{display:block;padding:9px 12px;margin:6px 0;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
label:hover{border-color:var(--ac)}
label.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
label.right{border-color:var(--ok);background:var(--okb)}
label.wrong{border-color:var(--no);background:var(--nob)}
input{margin-right:8px}
.fb{font-size:.9rem;margin-top:8px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:1rem;cursor:pointer;margin:4px 6px 4px 0}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
#res{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0;display:none}
#res .big{font-size:2rem;font-weight:700}
#res a{color:var(--no);cursor:pointer;margin-right:8px;display:inline-block}
.note{font-size:.8rem;color:var(--mut)}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.nav button{flex:1 1 90px;margin:0;padding:10px 6px}.nav button:not(.on){background:transparent;color:var(--ac);border:1px solid var(--ac)}
.em{display:block;width:100%;box-sizing:border-box;padding:10px;margin:6px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:1rem}
a.btn{display:inline-block;background:var(--ac);color:#fff!important;padding:10px 18px;border-radius:8px;text-decoration:none;margin:4px 6px 4px 0}
details{border-top:1px solid var(--bd);padding:6px 0;font-size:.9rem}
</style></head><body><main>
<h1>ITIL 4 Mock Exams – Papers 10 &amp; 11</h1>
<div class="nav" id="nav"><button data-p="10">Paper 10</button><button data-p="11">Paper 11</button></div>
<div class="q" id="gate"><p id="gt"></p>
<label style="cursor:default">Email to receive the result<input class="em" id="em" type="email" placeholder="xyz@gmail.com"></label>
<button id="start">Start test</button><button class="sec" id="hb">Previous attempts</button>
<div id="hist" style="display:none;margin-top:10px"></div></div>
<div id="test" style="display:none">
<div class="bar"><span id="prog"></span><span id="pm"></span></div>
<div id="res"></div><div id="qs"></div>
<button id="sub">Submit &amp; see score</button><button class="sec" id="rst">Reset</button></div>
<p class="note">Papers 10–11 use your supplied answer keys with options in original order. Pass mark is 65% (26 / 40).</p>
</main>
<script>
const T10=`Who is responsible for embedding continuing improvement into the way people think and work at a workplace?|Highest levels of the organization;Society;Service manager;All members of society|A
Who defines the requirements for a service and takes responsibility for the outcomes of service consumption?|User;Sponsor;Customer;Service provider|C
What is important for the success of ITSM?|Relationships with all key stakeholders are understood and managed.;Suppliers and investors are known from the start of the service;Government regulations are added as requirements;Users define requirements|A
Services that an organization provides are based on:|One or more of its services;One or more of its products;One or more of its suppliers;One or more of its customers|B
Which of the following would an organization consider its resources? 1. People / 2. Information and technology / 3. Value streams and processes / 4. Partners and suppliers|1 and 2 only;1 and 3 only;1 and 4 only;All of the above|D
A customer achieves value from a service without having to manage?|Cost and risk;Cost and time;Cost and technology;Cost and products|A
An outcome can be described as a?|Need for a stakeholder;Set of related services;Result for a stakeholder enabled by one or more outputs;Result for a service provider enabled by one or more products|C
Service providers present their services to consumers in the form of?|Service gifts;Service offerings;Products;Resources|B
Service offering generally includes? 1. Goods / 2. Access to resources / 3. Service actions / 4. Technology|1, 2 and 3;1 and 4 only;3 and 4 only;All of the above|A
When goods are transferred from the provider to the consumer, who takes responsibility for their future use?|Supplier;Service provider;Stakeholder;Consumer|D
Service actions must be performed by the service provider according to?|Government regulations;Agreement;Service provider requirements;Method of delivery|B
Which of the following ownership is not transferred to the customer?|Goods;Access to resources;Service actions;Technology|B
What is established between two or more organizations to co-create value?|Service offering;Service technology;Service relationship;Service meeting|C
What is a tangible or intangible deliverable of an activity?|Outcome;Output;Deliverable;Scope|B
What are the two types of cost from a service consumer’s perspective?|Costs removed and costs imposed by the service;Risk cost and product cost;Risk cost and cost removed;Cost imposed and risk cost|A
What is a possible event that could cause harm or loss?|Service failure;Risk;Service loss;Service risk|B
What can be summarized as ‘what the service can do’?|Warranty;Service function;Service performance;Utility|D
What practice ensures that conflicting stakeholder requirements are mediated appropriately?|Relationship management practice;Stakeholder management;Conflict management;Problem management|A
What recovers from incidents after they have been detected?|Prevention;Detection;Correction;Users|C
What would be considered ‘fit for use’?|Service;Utility;Warranty;Usage|C
What ensures that someone can’t deny that they took an action?|Confidentiality;Integrity;Non-repudiation;Availability|C
Products are configurations of?|Information and technology;People;Processes;Resources|D
What can cause services to become undeliverable or not meeting expectations?|Cost of service being too high;Risk not being removed;Failing to address all four dimensions properly;Service introducing new risk|C
What should every person in the organization have a clear understanding of?|Their contribution towards creating value;Their authority levels;Their skillset and abilities;Their work schedules|A
The organizations and people dimension of a service covers: 1. Roles / 2. Formal organization structures / 3. Processes|1, 2 and 3;1 and 2 only;1 and 3 only;None of the above|B
What is one or more metrics that defines expected or achieved service quality?|Service requirement;Service goal;Service achievement;Service level|D
Which approach to deployment is used when new or changed components are deployed to all targets at the same time?|Phased deployment;Continuous delivery;Big bang deployment;Pull deployment|C
________ is any financially valuable component that can contribute to the delivery of an IT product or service.|Service asset;Product asset;User asset;IT asset|D
Information security management must be driven from?|Users;Senior level management;IT workers;Regulators|B
If a security incident cannot be prevented, what must be done?|Change the service;Detection of the security incident;Correction of the security incident;Changes in user training|B
If a security incident cannot be prevented, what must be done?|Change the service;Detection of the security incident;Correction of the security incident;Changes in user training|B
Information security is critically dependent on the?|IT assets;Behavior of people;Software used throughout the organization;Skills of IT workers|B
What ensures that someone is who they claim to be?|Confidentiality;Integrity;Non-repudiation;Authentication|D
What can be summarized as ‘how the service performs’?|Warranty;Service function;Service performance;Utility|A
The purpose of the ___________ practice is to protect the information needed by the organization to conduct its business.|Information security management;Asset security management;User security management;Problem management|A
The organization should evaluate and select suppliers based on: 1. Importance and impact / 2. Risk / 3. Cost|1, 2, and 3;1 and 2 only;2 and 3 only;1 and 3 only|A
What is the ability of an organization, person, process, application, configuration item, or IT service to carry out an activity called?|Offering;Capability;Skills;Competence|B
Service offerings describe?|Resources;Information and technology;One or more services based on one or more products.;One or more configuration based on one or more technology|C
What is a repeatable approach to the management of a particular type of change?|Change strategy;Change method;Change model;Change types|C
What is a security objective that ensures information is not made available or disclosed to unauthorized entities?|Confidentiality;Entitled;Availability;Authentication|A`;
const T11=`What is a justification for expenditure of organizational resources, providing information about costs, benefits, options, risks, and issues?|Business spending;Business assessment;Business impact assessment;Business case|D
What should be everyone’s responsibility in an organization?|Fixing incidents;Continual improvement;Creating policies;Implementing changes|B
Which of the following statements is correct about the continual improvement register (CIR)?|There can be more than one CIR in an organization;There must only be a single CIR for the entire organization;The CIR should only be updated by a single group;CIRs are not needed in an organization|A
What change may be subject to less testing than others?|Standard change;Normal change;Emergency change;User change|C
Information security is critically dependent upon the?|Technology available to secure IT assets;Skill level of the IT service manager;Behavior of people throughout the organization;Type of security software used in the organization|C
Which of the following statements is true about non-repudiation?|It’s about ensuring that someone can deny that they took an action;It’s about ensuring that someone can’t deny that they took an action;It’s about what actions an individual took;It has nothing to do with the actions of an individual|B
Change enablement balances the need to make beneficial changes and ____________?|The method to implement the change;The adverse effect of changes;The evolving needs of the business;The cost of the change|B
In high velocity organizations, it is common for change approval to be?|Done by a single group;Done by only senior management;Decentralized;Centralized|C
Which of the following is not an external factor in the four dimensions model?|Changes;Political;Economic;Legal|A
What choice is defined in ITIL to support the holistic approach in service management?|Four dimensions model;Two dimensions model;External factors model;Service model|A
Which of the following can lead to poor decision-making and in turn impact the organization’s ability to improve internal capabilities?|Insufficient changes;Insufficient user training;Insufficient visibility of work;Insufficient understanding of costs|C
Which guiding principle is about ensuring that service management includes understanding of how all parts of an organization work together?|Focus on value;Collaborate and promote visibility;Start where you are;Think and work holistically|D
Which of the following represents the steps an organization takes in the creation of value?|Four dimensions model;The service value chain;The guiding principles;The ITIL practices|B
What is the point of communication between the service provider and all its users?|Call center;IT Director;Service Desk;Service Center|C
Which of the following statements is correct about service request fulfillment?|Should be standardized and automated to the greatest degree possible;Should not be automated and allow users to implement the changes themselves;Should only be automated if users agree;Automation should not be an option when requesting a change|A
What role is held accountable for the delivery of a specific service?|Service Owner;Service manager;Service User;Service Director|A
A risk assessment does not need to be repeated for which of the following changes?|Standard changes;Normal changes;Emergency changes;User changes|A
Which practice coordinates the classification and ownership of incidents?|Change enablement;Incident management;Problem management;Service desk|D
Engage, plan, and improve are examples of?|Service value chain activities;Service value;Dimensions model;Service management|A
Organizational change management manages the _________ aspects of changes to ensure that improvements and organizational transformations are implemented successfully.|Cost;People;Service;Implementation|B
Which is NOT a component of the service value system?|Governance;Four dimensions;Service value chain;Continual improvement|B
Which of the following statements is correct about effective incident management?|Often requires a high level of collaboration within and between teams;Often requires no collaboration between teams;Often requires collaboration only between certain teams;Only requires collaboration between the service desk and change management|A
Which service value chain activity is done to provide a good understanding of stakeholder needs?|Plan;Improve;Engage;Obtain/build|C
When managing information security, an organization must strive to achieve a balance between protecting the organization and _________________.|Allowing it to innovate;Conserving resources;Expending resources;Training users|A
Which of the following practices has a major influence on how users perceive services?|Supplier management;Relationship management;Service desk;Deployment management|C
Which of the following is not an example of an operational metric?|Availability;Incident response times;Change and request processing times;Service deployment times|D
An IT asset is any __________ valuable component that can contribute to the delivery of an IT product or service.|Commercially;Financially;User;Service|B
Service request fulfillment generally includes which of the following types of changes?|Emergency change;Standard change;Normal change;Expedited change|B
Which deployment approach allows for frequent customer feedback?|Phased deployment;Big Bang deployment;Pull deployment;Continuous delivery|D
A router was recently upgraded with new memory. What practice will ensure this router is implemented into operations?|Service desk;Deployment management;Service level management;IT asset management|B
What practice helps to optimize the use of valuable resources?|IT asset management;Service desk;Incident management;Problem management|A
Information security management is primarily driven by?|Users;IT security manager;The most senior level in the organization;Type of security software available in the marketplace|C
What is it called when new or changed components are deployed to just part of the production environment at a time?|Phased deployment;Continuous delivery;Big bang deployment;Pull deployment|A
New software has been made available on the network and users are able to install it at a time that is convenient for them. Which deployment approach is this?|Phased deployment;Big Bang deployment;Pull deployment;Users deployment|C
Which of the following statements about change enablement is correct? 1. Scope is defined by the organization / 2. There are 3 types of changes / 3. Change authority is who authorizes a change|1 and 2;1 and 3;2 and 3;1, 2 and 3|D
Which of the following would be an example of a service request?|Deploy a new change;Deploy a new software;Delaying the deployment of a new service;Giving feedback, compliments and complaints about services|D
It is common practice to use a decentralized change approval process in what type of organization?|Low-velocity organization;Small organization;High-velocity organization;Large organization|C
The IT department will be installing a new application to all users over the weekend. What deployment approach is this?|Phased deployment;Continuous delivery;Big Bang deployment;All in one deployment|C
The ITIL SVS includes how many general management practices?|10;12;14;26|C
Events are often classified as: 1. Information / 2. Warning / 3. Exceptions|1 and 2 only;1 and 3 only;2 and 3 only;All of the above|D`;
function decodeFixed(t){return t.split("\n").map(l=>{const[q,o,a]=l.split("|");return[q,o.split(";"),a.charCodeAt(0)-65]})}
const PAPERS={10:{n:"Paper 10: ITIL 4 Foundation Practice Set C",qs:decodeFixed(T10)},11:{n:"Paper 11: ITIL 4 Foundation Practice Set D",qs:decodeFixed(T11)}};
const L="ABCD",$=s=>document.querySelector(s),mem={};
const pass=n=>Math.ceil(n*.65);
const sg=k=>{try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return mem[k]??null};
const ss=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}};
const hist=p=>{try{return JSON.parse(sg('itil_h'+p)||'[]')}catch(e){return[]}};
let paper=10,ans={},done=false,email="";
function histRender(){const h=hist(paper).slice().reverse(),qs=PAPERS[paper].qs;
 $('#hist').innerHTML=h.length?h.map(a=>`<details><summary>${a.t} — <b>${a.s}/${qs.length}</b> (${a.w.length} wrong)</summary>`+(a.w.length?a.w.map(([i,y])=>`<div>Q${i+1}: ${y<0?'skipped':'you '+L[y]}, correct ${L[qs[i][2]]}</div>`).join(''):'Perfect score')+`</details>`).join(''):'<p class="note">No previous attempts for this paper yet.</p>';}
function show(p,open){paper=p;done=false;ans={};
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',+b.dataset.p==p));
 $('#gate').style.display='block';$('#test').style.display='none';
 $('#gt').textContent=PAPERS[p].n+' · '+PAPERS[p].qs.length+' questions';
 $('#em').value=sg('itil_email')||'';histRender();$('#hist').style.display=open?'block':'none';window.scrollTo(0,0);}
function render(){done=false;for(const k in ans)delete ans[k];$('#res').style.display='none';$('#sub').disabled=false;
 const qs=PAPERS[paper].qs,n=qs.length;
 $('#prog').textContent=`Answered 0 / ${n}`;$('#pm').textContent=`Pass mark: ${pass(n)} / ${n} (65%)`;
 $('#qs').innerHTML=qs.map((q,i)=>`<div class="q" id="q${i}"><p>${i+1}. ${q[0]}</p>`+q[1].map((o,j)=>`<label id="l${i}_${j}"><input type="radio" name="q${i}" value="${j}">${L[j]}. ${o}</label>`).join('')+`<div class="fb"></div></div>`).join('');
 document.querySelectorAll('#qs input').forEach(r=>r.onchange=()=>{
  if(done)return;const i=+r.name.slice(1);ans[i]=+r.value;
  qs[i][1].forEach((_,j)=>$('#l'+i+'_'+j).classList.toggle('sel',j==ans[i]));
  $('#prog').textContent=`Answered ${Object.keys(ans).length} / ${n}`;});
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(+b.dataset.p));
$('#hb').onclick=()=>{const h=$('#hist');h.style.display=h.style.display=='none'?'block':'none'};
$('#start').onclick=()=>{const e=$('#em').value.trim();
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){alert('Please enter a valid email address.');return}
 email=e;ss('itil_email',e);$('#gate').style.display='none';$('#test').style.display='block';render();window.scrollTo(0,0)};
$('#sub').onclick=()=>{
 const qs=PAPERS[paper].qs,n=qs.length,pm=pass(n),un=qs.map((_,i)=>i).filter(i=>!(i in ans));
 if(un.length&&!confirm(un.length+' question(s) unanswered (counted as wrong). Submit anyway?'))return;
 done=true;$('#sub').disabled=true;let s=0,wrong=[];
 qs.forEach((q,i)=>{
  const ok=ans[i]===q[2];if(ok)s++;else wrong.push(i);
  const box=$('#q'+i);box.classList.add(ok?'good':'bad');
  q[1].forEach((_,j)=>{const l=$('#l'+i+'_'+j);l.classList.remove('sel');l.querySelector('input').disabled=true;
   if(j==q[2])l.classList.add('right');else if(j==ans[i])l.classList.add('wrong');});
  box.querySelector('.fb').innerHTML=ok?`<span style="color:var(--ok)">✔ Correct</span>`:`<span style="color:var(--no)">✘ ${i in ans?'Your answer: '+L[ans[i]]:'Not answered'} — Correct answer: ${L[q[2]]}</span>`;
 });
 const h=hist(paper);h.push({t:new Date().toLocaleString(),s,w:wrong.map(i=>[i,i in ans?ans[i]:-1])});ss('itil_h'+paper,JSON.stringify(h.slice(-20)));
 const pct=Math.round(s/n*100),verdict=s>=pm?'Pass':'Below pass mark';
 const body=`ITIL 4 – ${PAPERS[paper].n}\nScore: ${s}/${n} (${pct}%) – ${verdict}\nWrong: ${wrong.length}\n\n`+wrong.map(i=>`Q${i+1}: ${i in ans?'your '+L[ans[i]]:'skipped'}, correct ${L[qs[i][2]]}`).join('\n');
 const href=`mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent('ITIL 4 '+PAPERS[paper].n+' result: '+s+'/'+n)}&body=${encodeURIComponent(body)}`;
 const r=$('#res');r.style.display='block';
 r.innerHTML=`<div class="big">${s} / ${n} (${pct}%)</div><div>${s>=pm?'🎉 Pass':'Below pass mark ('+pm+')'} · ${wrong.length} wrong</div>`+
  (wrong.length?`<p><b>Wrong questions (tap to jump):</b><br>${wrong.map(i=>`<a onclick="document.getElementById('q${i}').scrollIntoView({behavior:'smooth'})">Q${i+1}</a>`).join('')}</p>`:'<p>Perfect score!</p>')+
  `<a class="btn" href="${href}" target="_blank" rel="noopener">✉ Email result to ${email}</a><button class="sec" onclick="show(paper,true)">Previous attempts</button>`;
 window.scrollTo({top:0,behavior:'smooth'});
};
$('#rst').onclick=()=>{render();window.scrollTo(0,0)};
show(10);
</script></body></html>
